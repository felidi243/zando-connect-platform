<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zando Connect — Admin V8</title><style>body{margin:0;font-family:system-ui;background:#f4f6f8;color:#17202a}.wrap{max-width:1100px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 12px #0001;margin-bottom:14px}.num{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #eee}.muted{color:#667085}.error{color:#b42318}</style></head><body><div class="wrap"><h1>Zando Connect — Administration V8</h1><p class="muted">Tableau de bord, livraisons, coursiers et commissions.</p><div id="cards" class="grid"></div><div class="card"><h2>Livraisons</h2><div id="deliveries">Chargement…</div></div><div class="card"><h2>Commissions</h2><div id="commissions">Chargement…</div></div></div><script>const token=localStorage.zandoToken;const H={Authorization:'Bearer '+(token||'')};async function get(p){const r=await fetch(p,{headers:H});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}async function load(){try{const [d,l,c]=await Promise.all([get('/api/v1/admin/dashboard'),get('/api/v1/admin/deliveries'),get('/api/v1/admin/commission-summary')]);cards.innerHTML=Object.entries(d).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="num">${v}</div></div>`).join('');deliveries.innerHTML='<table><tr><th>Tracking</th><th>Statut</th><th>Coursier</th><th>Distance</th></tr>'+l.items.map(x=>`<tr><td>${x.trackingCode}</td><td>${x.status}</td><td>${x.courierId||'—'}</td><td>${x.courierLatitude&&x.clientLatitude?'GPS disponible':'—'}</td></tr>`).join('')+'</table>';commissions.innerHTML=`Commission totale : <strong>${c.totalCommission.toFixed(2)}</strong> USD · Net marchand : <strong>${c.totalMerchantNet.toFixed(2)}</strong> USD`; }catch(e){cards.innerHTML='<p class="error">'+e.message+'</p>'}}load();setInterval(load,15000)</script></body></html>
