<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zando Delivery — Coursier</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui;background:#f6f7f9}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;margin-bottom:16px}#map{height:60vh;border-radius:12px}</style></head><body><div class="wrap"><div class="card"><h2>Carte coursier</h2><p id="status">Connectez-vous puis indiquez deliveryId dans l’URL.</p></div><div class="card"><div id="map"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const id=new URLSearchParams(location.search).get('deliveryId');let map,me,client,line;async function refreshClient(){if(!id||!localStorage.zandoToken)return;const r=await fetch('/api/v1/courier/deliveries/'+encodeURIComponent(id)+'/location',{headers:{Authorization:'Bearer '+localStorage.zandoToken}});if(!r.ok)return;const d=await r.json();if(d.clientLocation){const p=[d.clientLocation.latitude,d.clientLocation.longitude];if(!client)client=L.marker(p).addTo(map).bindPopup('Client');else client.setLatLng(p);if(me){const q=me.getLatLng();const pts=[[q.lat,q.lng],p];if(!line)line=L.polyline(pts).addTo(map);else line.setLatLngs(pts)}}}
function start(){map=L.map('map').setView([-4.325,15.322],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);if(!navigator.geolocation){status.textContent='Géolocalisation indisponible.';return}navigator.geolocation.watchPosition(async p=>{const lat=p.coords.latitude,lng=p.coords.longitude;if(!me)me=L.marker([lat,lng]).addTo(map).bindPopup('Vous');else me.setLatLng([lat,lng]);if(id&&localStorage.zandoToken){await fetch('/api/v1/courier/deliveries/'+encodeURIComponent(id)+'/location',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+localStorage.zandoToken},body:JSON.stringify({latitude:lat,longitude:lng})});}},e=>status.textContent='Autorisez la localisation GPS pour partager votre position.',{enableHighAccuracy:true,maximumAge:5000,timeout:10000});},e=>status.textContent='Autorisez la localisation GPS pour partager votre position.',{enableHighAccuracy:true,maximumAge:5000,timeout:10000});refreshClient();setInterval(refreshClient,10000)}start();
</script></body></html>
