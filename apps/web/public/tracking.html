<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zando Delivery — Suivi</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui;background:#f6f7f9;color:#17202a}header{padding:16px;background:#111827;color:white}main{max-width:1000px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 12px #0001;margin-bottom:16px}#map{height:60vh;border-radius:12px}.muted{color:#667085}</style></head><body><header><strong>Zando Delivery</strong> — Suivi de votre colis</header><main><div class="card"><h2>Localisation de la livraison</h2><div id="info" class="muted">Chargement…</div></div><div class="card"><div id="map"></div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const params=new URLSearchParams(location.search),id=params.get('deliveryId');let map,cm,dm,line;let lastClient={};
async function load(){if(!id){info.textContent='Ajoutez ?deliveryId=... à l’URL.';return}const r=await fetch('/api/v1/deliveries/'+encodeURIComponent(id)+'/location',{headers:{Authorization:'Bearer '+(localStorage.zandoToken||'')}});const d=await r.json();if(!r.ok){info.textContent=d.error||'Impossible de charger le suivi.';return}info.textContent=d.distanceKm!=null?`Livreur à environ ${d.distanceKm} km. Statut : ${d.status}.`:`Statut : ${d.status}. Position du livreur en attente.`;if(!map){map=L.map('map').setView([-4.325,15.322],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map)}if(d.clientLocation){if(!cm)cm=L.marker([d.clientLocation.latitude,d.clientLocation.longitude]).addTo(map).bindPopup('Votre position');else cm.setLatLng([d.clientLocation.latitude,d.clientLocation.longitude])}if(d.courierLocation){if(!dm)dm=L.marker([d.courierLocation.latitude,d.courierLocation.longitude]).addTo(map).bindPopup('Livreur');else dm.setLatLng([d.courierLocation.latitude,d.courierLocation.longitude])}if(d.clientLocation&&d.courierLocation){const pts=[[d.clientLocation.latitude,d.clientLocation.longitude],[d.courierLocation.latitude,d.courierLocation.longitude]];if(!line)line=L.polyline(pts).addTo(map);else line.setLatLngs(pts)}}
if(navigator.geolocation&&id){navigator.geolocation.watchPosition(async p=>{const token=localStorage.zandoToken;if(!token)return;await fetch('/api/v1/deliveries/'+encodeURIComponent(id)+'/location',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude})});},()=>{}, {enableHighAccuracy:true,maximumAge:10000,timeout:10000});}load();setInterval(load,10000);
</script></body></html>
