<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zando Connect — Espace marchand V3</title><link rel="stylesheet" href="/merchant.css"></head><body>
<header><b>ZANDO CONNECT</b><span>Espace marchand — V3</span></header><main>
<section class="panel"><h1>Gestion de ma boutique</h1><p>Développement V3 : produits et stock.</p><label>ID marchand de test <input id="merchant" value="merchant-001"></label><button id="load">Charger mes produits</button></section>
<section class="panel"><h2>Ajouter un produit</h2><form id="create"><input id="name" placeholder="Nom du produit" required><textarea id="desc" placeholder="Description"></textarea><input id="price" type="number" min=".01" step=".01" placeholder="Prix" required><input id="stock" type="number" min="0" step="1" placeholder="Stock" required><select id="cat"><option value="cat-001">Mode</option><option value="cat-002">Beauté</option><option value="cat-003">Accessoires</option><option value="cat-004">Maison</option></select><input id="image" placeholder="URL image (optionnel)"><button>Ajouter</button></form></section>
<section class="panel"><h2>Produits</h2><div id="status"></div><div id="products"></div></section></main><script src="/merchant.js"></script></body></html>
